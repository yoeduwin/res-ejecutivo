// ============================================================
// GESTIÓN DE TABLAS DINÁMICAS

/**
 * Agrega una nueva fila a la tabla clonando la fila template.
 * @param {string} tbodyId - ID del tbody de destino
 */
function agregarFila(tbodyId) {
  const tbody    = document.getElementById(tbodyId);
  const template = tbody.querySelector('.fila-template');
  if (!template) return;

  // Clonar la fila template
  const nuevaFila = template.cloneNode(true);
  nuevaFila.classList.remove('fila-template');
  nuevaFila.style.display = '';

  // Limpiar los valores de los inputs/selects clonados
  nuevaFila.querySelectorAll('input').forEach(function (inp) {
    inp.value = '';
  });
  nuevaFila.querySelectorAll('select').forEach(function (sel) {
    sel.selectedIndex = 0;
    sel.disabled      = false;
  });

  tbody.appendChild(nuevaFila);
  renumerarFilas(tbody);
}

/**
 * Elimina la fila que contiene el botón pulsado y renumera.
 * @param {HTMLElement} btn - Botón ✕ que fue clickeado
 */
function eliminarFila(btn) {
  const fila  = btn.closest('tr');
  const tbody = fila.parentElement;
  fila.remove();
  renumerarFilas(tbody);
}

/**
 * Actualiza la numeración secuencial en la primera columna de cada fila.
 * @param {HTMLElement} tbody
 */
function renumerarFilas(tbody) {
  const filas = tbody.querySelectorAll('tr:not(.fila-template)');
  filas.forEach(function (fila, index) {
    const celda = fila.querySelector('.num-fila');
    if (celda) celda.textContent = index + 1;
  });
}

// Si la 1ra medición es ✖, bloquear 2da y 3ra como NA
// ============================================================
/**
 * Aplica la regla NA: si 1ra medición = ✖ → 2da y 3ra = NA (bloqueados).
 * @param {HTMLSelectElement} sel025 - Select de la 1ra medición
 */
function aplicarReglaNa(sel025) {
  const fila = sel025.closest('tr');
  const med2 = fila.querySelector('.med-2');
  const med3 = fila.querySelector('.med-3');

  if (sel025.value === '✖') {
    // Bloquear 2da y 3ra como NA
    [med2, med3].forEach(function (sel) {
      sel.value    = 'NA';
      sel.disabled = true;
    });
  } else {
    // Restaurar selects
    [med2, med3].forEach(function (sel) {
      sel.disabled = false;
      if (sel.value === 'NA') sel.value = '✓';
    });
  }
}

/**
 * Verifica los campos requeridos y la presencia de filas por NOM.
 * @returns {{ valido: boolean, errores: string[] }}
 */
function validarFormulario() {
  const errores = [];

  // Campos generales requeridos
  const campos = [
    { id: 'razonSocial', etiqueta: 'Razón Social' },
    { id: 'dirigidoA',   etiqueta: 'Dirigido a'   },
    { id: 'puesto',      etiqueta: 'Puesto del destinatario' },
    { id: 'fecha',       etiqueta: 'Fecha de emisión' }
  ];
  campos.forEach(function (c) {
    const val = document.getElementById(c.id).value.trim();
    if (!val) errores.push('El campo "' + c.etiqueta + '" es obligatorio.');
  });

  // Al menos una NOM activa
  const nomsActivas = obtenerNomsActivas();
  if (nomsActivas.length === 0) {
    errores.push('Seleccione al menos una NOM aplicable.');
  }

  // Cada NOM activa debe tener al menos 1 fila por tabla
  const tablasPorNom = {
    '011': ['tbody-011-1', 'tbody-011-2'],
    '022': ['tbody-022-1', 'tbody-022-2'],
    '025': ['tbody-025'],
    '024': ['tbody-024']
  };
  nomsActivas.forEach(function (nom) {
    const tablas = tablasPorNom[nom] || [];
    tablas.forEach(function (tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!tbody) return;
      const filas = tbody.querySelectorAll('tr:not(.fila-template)');
      if (filas.length === 0) {
        errores.push(
          'La NOM-' + nom + ' requiere al menos una fila en cada tabla (tbody: ' + tbodyId + ').'
        );
      }
    });
  });

  return { valido: errores.length === 0, errores: errores };
}

// ============================================================
/**
 * Devuelve un array con los códigos de las NOMs marcadas ('011', '022', '025').
 * @returns {string[]}
 */
function obtenerNomsActivas() {
  return ['011', '022', '025', '024'].filter(function (nom) {
    const chk = document.getElementById('check-' + nom);
    return chk && chk.checked;
  });
}

/**
 * Lee todas las filas visibles de un tbody y devuelve un array de arrays de valores.
 * @param {string} tbodyId
 * @returns {string[][]}
 */
function leerFilasTabla(tbodyId) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return [];
  const filas = tbody.querySelectorAll('tr:not(.fila-template)');
  return Array.from(filas).map(function (fila) {
    return Array.from(fila.querySelectorAll('input, select')).map(function (el) {
      return el.value;
    });
  });
}

/**
 * Recolecta todos los datos del formulario en un único objeto.
 * @returns {Object}
 */
function recolectarDatos() {
  const nomsActivas = obtenerNomsActivas();

  const datos = {
    razonSocial:    document.getElementById('razonSocial').value.trim(),
    direccionCalle: document.getElementById('direccionCalle').value.trim(),
    direccionCP:    document.getElementById('direccionCP').value.trim(),
    fecha:          document.getElementById('fecha').value,
    dirigidoA:      document.getElementById('dirigidoA').value.trim(),
    puesto:         document.getElementById('puesto').value.trim(),
    noms:           nomsActivas,
    tablas:         {}
  };

  // Leer tablas de cada NOM activa
  if (nomsActivas.includes('011')) {
    datos.tablas['011-1'] = leerFilasTabla('tbody-011-1');
    datos.tablas['011-2'] = leerFilasTabla('tbody-011-2');
  }
  if (nomsActivas.includes('022')) {
    datos.tablas['022-1'] = leerFilasTabla('tbody-022-1');
    datos.tablas['022-2'] = leerFilasTabla('tbody-022-2');
  }
  if (nomsActivas.includes('025')) {
    datos.tablas['025']   = leerFilasTabla('tbody-025');
  }
  if (nomsActivas.includes('024')) {
    datos.tablas['024']   = leerFilasTabla('tbody-024');
  }

  // Total de puntos evaluados (suma de todas las filas de todas las tablas)
  datos.totalPuntos = Object.values(datos.tablas).reduce(function (acc, t) {
    return acc + t.length;
  }, 0);

  return datos;
}

  seccionPreview.style.display = 'block';
  seccionPreview.scrollIntoView({ behavior: 'smooth', block: 'start' });

/**
 * Formatea una fecha ISO (YYYY-MM-DD) en español: "23 de marzo de 2026".
 * @param {string} fechaIso
 * @returns {string}
 */
function formatearFechaEspanol(fechaIso) {
  if (!fechaIso) return '';
  const partes = fechaIso.split('-');
  const anio   = parseInt(partes[0], 10);
  const mes    = parseInt(partes[1], 10) - 1;
  const dia    = parseInt(partes[2], 10);
  return dia + ' de ' + MESES[mes] + ' de ' + anio;
}

          <th style="width:90px">2da medición</th>
          <th style="width:90px">3ra medición</th>
        </tr></thead>
        <tbody>
          ${t.map(function (r, i) {
            return `<tr>
              <td style="text-align:center">${i+1}</td>
              <td>${r[0]||''}</td><td>${r[1]||''}</td>
              <td style="text-align:center">${r[2]||''}</td>
              <td style="text-align:center">${r[3]||''}</td>

      </div>`;
  }

  if (nom === '024') {
    const t = datos.tablas['024'] || [];
    const denExtSup = t.filter(function (r) { return r[2] === 'Dentro'; }).length;
    const denCuerpo = t.filter(function (r) { return r[3] === 'Dentro'; }).length;

    contenido += `
      <div class="doc-nom-subtitulo">Tabla — Evaluación de vibraciones</div>
      <table class="doc-tabla-resumen">
        <thead><tr>
          <th style="width:40px">N°</th><th>Fuente</th><th>Nombre del trabajador</th>
          <th style="width:110px">Extremidades superiores</th>
          <th style="width:110px">Cuerpo entero</th>
          <th style="width:110px">Conclusión</th>
        </tr></thead>
        <tbody>
          ${t.map(function (r, i) {
            return `<tr>
              <td style="text-align:center">${i+1}</td>
              <td>${r[0]||''}</td><td>${r[1]||''}</td>
              <td style="text-align:center">${r[2]||''}</td>
              <td style="text-align:center">${r[3]||''}</td>
              <td style="text-align:center">${r[4]||''}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="doc-conteos">
        <span class="doc-conteo-linea"><span class="doc-conteo-num">${t.length}</span> …… puntos en total evaluados</span>
        <span class="doc-conteo-linea"><span class="doc-conteo-num">${denExtSup}</span> …… se encuentran dentro de norma en extremidades superiores</span>
        <span class="doc-conteo-linea"><span class="doc-conteo-num">${denCuerpo}</span> …… se encuentran dentro de norma en cuerpo entero</span>
      </div>`;
  }

  return contenido;
}

/**
 * Genera el HTML del resumen ejecutivo completo (todas las NOMs activas).
 * Una página de carta + una página de resumen por NOM.
 * @param {Object} datos
 * @returns {string}
 */
function renderizarDocumentoCompleto(datos) {
  let html = '';

  datos.noms.forEach(function (nom, idx) {
    // Página 1: Carta de presentación (el QR genérico solo se incluye una vez, en la primera carta)
    html += renderizarCartaPresentacion(datos, nom, idx === 0);

    // Página 2: Resumen ejecutivo con tablas
    const titulos = {
      '011': 'NOM-011-STPS-2001 — Ruido Laboral',
      '022': 'NOM-022-STPS-2015 — Electricidad Estática',
      '025': 'NOM-025-STPS-2008 — Iluminación',
      '024': 'NOM-024-STPS-2001 — Vibraciones'
    };
    html += `
      <div class="doc-pagina">
        ${htmlHeaderDoc()}
        <div class="doc-seccion-titulo">Resumen Ejecutivo — ${titulos[nom]}</div>
        <div class="doc-intro">
          A continuación se presentan los resultados obtenidos durante la evaluación
          realizada en las instalaciones de <strong>${datos.razonSocial}</strong>,
          conforme a los criterios establecidos en la normatividad aplicable.
        </div>
        ${renderizarTablaResumen(datos, nom)}
      </div>`;
  });

  return html;
}

/**
 * Genera el QR genérico (sitio web de la empresa) dentro del contenedor
 * #doc-qr-generico, insertado por renderizarCartaPresentacion() en la
 * primera página del documento. Se genera localmente con qrcode.js,
 * sin depender de ninguna API externa.
 */
function generarQRGenerico() {
  const contenedorQr = document.getElementById('doc-qr-generico');
  if (!contenedorQr || typeof QRCode === 'undefined') return;
  contenedorQr.innerHTML = '';
  new QRCode(contenedorQr, {
    text:   'https://' + EMPRESA.sitio,
    width:  80,
    height: 80
  });
}

// ============================================================
// EXPORTACIÓN PDF con jsPDF
// ============================================================
/**
 * Genera y descarga el PDF de la vista previa usando jsPDF + html2canvas.
 */
function descargarPDF() {
  const elemento = document.getElementById('vista-previa');
  if (!elemento || !elemento.innerHTML.trim()) {
    mostrarError('Primero genere el Resumen Ejecutivo antes de descargar el PDF.');
    return;
  }

  // Construir nombre del archivo
  const razon  = document.getElementById('razonSocial').value.trim()
                          .replace(/[^a-zA-Z0-9\u00C0-\u024F\s]/g, '')
                          .replace(/\s+/g, '_');
  const fecha  = document.getElementById('fecha').value.replace(/-/g, '');
  const nombre = 'ResumenEjecutivo_' + razon + '_' + fecha + '.pdf';

  // Configuración de jsPDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: 'portrait',
    unit:        'mm',
    format:      'letter'
  });

  doc.html(elemento, {
    callback: function (pdfDoc) {
      pdfDoc.save(nombre);
    },
    x:          10,
    y:          10,
    width:       190,      // ancho en mm dentro de la página carta
    windowWidth: 900       // ancho del viewport de referencia
  });
}

// ============================================================
// BORRADOR JSON — Guardar
// ============================================================
/**
 * Serializa el estado actual del formulario y lo descarga como .json.
 */
function guardarBorrador() {
  const datos = recolectarDatos();
  const json  = JSON.stringify(datos, null, 2);
  const blob  = new Blob([json], { type: 'application/json' });
  const url   = URL.createObjectURL(blob);

  const razon  = datos.razonSocial.replace(/[^a-zA-Z0-9\u00C0-\u024F\s]/g, '')
                                   .replace(/\s+/g, '_') || 'Borrador';
  const fecha  = datos.fecha ? datos.fecha.replace(/-/g, '') : 'sin-fecha';
  const nombre = 'Borrador_' + razon + '_' + fecha + '.json';

  const enlace     = document.createElement('a');
  enlace.href      = url;
  enlace.download  = nombre;
  enlace.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// PERFIL DE DATOS — Carga desde Excel
// ============================================================
// Mapeo de celdas del Excel "Perfil de datos" (mismo documento que usan
// otras herramientas internas) hacia los 4 campos de "Datos del cliente".
const PERFIL_CELL_MAP = {
  companyName:            'D5',
  evaluationAddress:      'D11',
  reportRecipientName:    'D26',
  reportRecipientPosition:'D28'
};

/**
 * Lee el valor de una celda de una hoja de SheetJS, o '' si no existe.
 * @param {Object} ws - Hoja de SheetJS (worksheet)
 * @param {string} cellRef - Referencia de celda, ej. 'D5'
 * @returns {string}
 */
function getCellValue(ws, cellRef) {
  const celda = ws[cellRef];
  return (celda && celda.v !== undefined) ? String(celda.v).trim() : '';
}

/**
 * Lee el Excel "Perfil de datos" seleccionado y autocompleta Razón Social,
 * Dirección, Dirigido a y Puesto (únicos campos que usa este formulario).
 * @param {Event} event - Evento change del input[type=file]
 */
function cargarPerfilExcel(event) {
  ocultarError();
  const archivo = event.target.files[0];
  if (!archivo) return;

  if (typeof XLSX === 'undefined') {
    mostrarError('No se pudo cargar la librería de lectura de Excel. Verifique su conexión e intente de nuevo.');
    event.target.value = '';
    return;
  }

  const lector = new FileReader();
  lector.onload = function (e) {
    try {
      const datos = new Uint8Array(e.target.result);
      const libro = XLSX.read(datos, { type: 'array' });
      const hoja  = libro.Sheets[libro.SheetNames[0]];

      document.getElementById('razonSocial').value    = getCellValue(hoja, PERFIL_CELL_MAP.companyName);
      document.getElementById('direccionCalle').value  = getCellValue(hoja, PERFIL_CELL_MAP.evaluationAddress);
      document.getElementById('dirigidoA').value       = getCellValue(hoja, PERFIL_CELL_MAP.reportRecipientName);
      document.getElementById('puesto').value          = getCellValue(hoja, PERFIL_CELL_MAP.reportRecipientPosition);

      const estado = document.getElementById('perfil-status');
      if (estado) estado.textContent = '✓ Datos cargados desde el perfil.';
    } catch (err) {
      mostrarError('El archivo no pudo leerse como un Excel de Perfil de datos válido.');
    }
    // Resetear el input para permitir cargar el mismo archivo nuevamente
    event.target.value = '';
  };
  lector.readAsArrayBuffer(archivo);
}

// ============================================================
// BORRADOR JSON — Cargar
// ============================================================
/**
 * Lee el archivo .json seleccionado y restaura el formulario.
 * @param {Event} event - Evento change del input[type=file]
 */
function cargarBorrador(event) {
  const archivo = event.target.files[0];
  if (!archivo) return;

  const lector = new FileReader();
  lector.onload = function (e) {
    try {
      const datos = JSON.parse(e.target.result);
      restaurarFormulario(datos);
    } catch (err) {
      mostrarError('El archivo seleccionado no es un borrador válido.');
    }
    // Resetear el input para permitir cargar el mismo archivo nuevamente
    event.target.value = '';
  };
  lector.readAsText(archivo);
}

/**
 * Restaura todos los campos, checkboxes y tablas a partir de un objeto de datos.
 * @param {Object} datos
 */
function restaurarFormulario(datos) {
  ocultarError();

  // Campos generales
  ['razonSocial','direccionCalle','direccionCP','fecha','dirigidoA','puesto']
    .forEach(function (id) {
      const el = document.getElementById(id);
      if (el && datos[id] !== undefined) el.value = datos[id];
    });

  // Desactivar todas las NOMs primero
  ['011','022','025','024'].forEach(function (nom) {
    const chk = document.getElementById('check-' + nom);
    if (chk) { chk.checked = false; toggleSeccionNom(nom, false); }
  });

  // Activar NOMs del borrador y restaurar sus tablas
  const tablasPorNom = {
    '011': [
      { tbodyId: 'tbody-011-1', claves: ['011-1'] },
      { tbodyId: 'tbody-011-2', claves: ['011-2'] }
    ],
    '022': [
      { tbodyId: 'tbody-022-1', claves: ['022-1'] },
      { tbodyId: 'tbody-022-2', claves: ['022-2'] }
    ],
    '025': [
      { tbodyId: 'tbody-025', claves: ['025'] }
    ],
    '024': [
      { tbodyId: 'tbody-024', claves: ['024'] }
    ]
  };

  (datos.noms || []).forEach(function (nom) {
    const chk = document.getElementById('check-' + nom);
    if (chk) { chk.checked = true; toggleSeccionNom(nom, true); }

    (tablasPorNom[nom] || []).forEach(function (config) {
      const filas = (datos.tablas || {})[config.claves[0]] || [];
      const tbody = document.getElementById(config.tbodyId);
      if (!tbody) return;

      // Limpiar filas existentes (dejar solo el template)
      tbody.querySelectorAll('tr:not(.fila-template)').forEach(function (f) {
        f.remove();
      });

      // Recrear filas
      filas.forEach(function (valoresFila) {
        agregarFila(config.tbodyId);
        const ultimaFila  = tbody.querySelectorAll('tr:not(.fila-template)');
        const filaActual  = ultimaFila[ultimaFila.length - 1];
        const controles   = filaActual.querySelectorAll('input, select');
        controles.forEach(function (ctrl, idx) {
          if (valoresFila[idx] !== undefined) {
            ctrl.value = valoresFila[idx];
            // Re-aplicar regla NA si es select de 1ra medición en NOM-025
            if (ctrl.classList.contains('med-1')) aplicarReglaNa(ctrl);
          }
        });
      });
    });
  });
}

// ============================================================
// HELPERS — Mensajes de error y log
// ============================================================
/**
 * Muestra el banner de error con el mensaje indicado.
 * @param {string} mensaje - HTML admitido
 */
function mostrarError(mensaje) {
  const banner = document.getElementById('banner-error');
  banner.innerHTML = '<strong>Por favor corrija lo siguiente:</strong><br>' + mensaje;
  banner.classList.add('visible');
  banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/** Oculta el banner de error. */
function ocultarError() {
  const banner = document.getElementById('banner-error');
  banner.classList.remove('visible');
  banner.innerHTML = '';
}

/**
 * Callback de éxito de google.script.run.registrarLog().
 */
function logExitoso() {
  // Log registrado correctamente — no se muestra notificación al usuario
  console.log('Log registrado en Google Sheets correctamente.');
}

/**
 * Callback de falla de google.script.run.registrarLog().
 * @param {Error} error
 */
function logError(error) {
  // El error de log no bloquea al usuario, solo se reporta en consola
  console.error('Error al registrar el log:', error);
}
