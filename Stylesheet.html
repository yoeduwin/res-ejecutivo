<style>
/* ============================================================
   Stylesheet.html — Resúmenes Ejecutivos · Ejecutiva Ambiental
   Estética corporativa sobria. Sin gradientes ni sombras exageradas.
   ============================================================ */

/* --- Variables de color --- */
:root {
  --verde:      #005600;
  --verde2:     #007836;
  --blanco:     #FFFFFF;
  --fondo:      #F7F7F7;
  --texto:      #1C1C1C;
  --subtexto:   #6B6B6B;
  --borde:      #B0B0B0;
  --error-bg:   #FFF0F0;
  --error-borde:#CC0000;
  --fila-par:   #F4F4F4;
}

/* --- Reset y base --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
               Helvetica, Arial, sans-serif;
  color: var(--texto);
  background: var(--fondo);
  line-height: 1.55;
}
a { color: var(--verde); }

/* --- Header corporativo --- */
header {
  background: var(--verde);
  color: var(--blanco);
  padding: 0 24px;
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  gap: 16px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-placeholder {
  width: 44px;
  height: 44px;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.empresa-info {
  display: flex;
  flex-direction: column;
}
.empresa-nombre {
  font-weight: 600;
  font-size: 0.88rem;
  line-height: 1.3;
}
.empresa-sub {
  font-size: 0.75rem;
  opacity: 0.8;
}
.app-titulo {
  font-size: 0.85rem;
  opacity: 0.85;
  text-align: right;
  white-space: nowrap;
}

/* --- Contenedor principal --- */
.contenedor {
  max-width: 960px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

/* --- Banner de error --- */
.banner-error {
  display: none;
  background: var(--error-bg);
  border: 1px solid var(--error-borde);
  border-left: 4px solid var(--error-borde);
  color: #990000;
  padding: 12px 16px;
  border-radius: 4px;
  margin-bottom: 24px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.banner-error.visible { display: block; }

/* --- Secciones del formulario --- */
.seccion-form {
  background: var(--blanco);
  border: 1px solid #E0E0E0;
  border-radius: 6px;
  padding: 24px;
  margin-bottom: 20px;
}
.seccion-titulo {
  font-size: 1rem;
  font-weight: 700;
  color: var(--verde);
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--verde);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.seccion-desc {
  color: var(--subtexto);
  font-size: 0.88rem;
  margin-bottom: 16px;
  margin-top: -10px;
}

/* --- Campos del formulario --- */
.campo-grupo {
  margin-bottom: 16px;
}
.perfil-status {
  font-size: 0.82rem;
  color: var(--verde2);
  margin-left: 10px;
}
.campo-ayuda {
  font-size: 0.8rem;
  color: #666;
  margin-top: 6px;
}
.campo-fila {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--texto);
  margin-bottom: 5px;
}
input[type="text"],
input[type="date"],
select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-radius: 4px;
  font-size: 0.9rem;
  color: var(--texto);
  background: var(--blanco);
  transition: border-color 0.15s;
}
input[type="text"]:focus,
input[type="date"]:focus,
select:focus {
  outline: none;
  border-color: var(--verde);
  box-shadow: 0 0 0 2px rgba(0,86,0,0.12);
}

/* --- Checkboxes de NOM --- */
.noms-checks {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.nom-check-label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid #E0E0E0;
  border-radius: 5px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.nom-check-label:hover {
  border-color: var(--verde);
  background: #F0F7F0;
}
.nom-check-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--verde);
  cursor: pointer;
  flex-shrink: 0;
}
.nom-check-texto {
  display: flex;
  flex-direction: column;
}
.nom-check-texto strong { font-size: 0.92rem; }
.nom-check-texto em { font-size: 0.82rem; color: var(--subtexto); font-style: normal; }

/* --- Secciones NOM colapsables --- */
.seccion-nom {
  background: var(--blanco);
  border: 1px solid #E0E0E0;
  border-left: 4px solid var(--verde);
  border-radius: 6px;
  padding: 24px;
  margin-bottom: 20px;
}
.nom-titulo {
  font-size: 0.95rem;
  margin-bottom: 20px;
}
.tabla-titulo {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--subtexto);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
  margin-top: 20px;
}
.tabla-titulo:first-of-type { margin-top: 0; }

/* --- Tablas de datos --- */
.tabla-contenedor {
  overflow-x: auto;
  margin-bottom: 10px;
  border: 1px solid var(--borde);
  border-radius: 4px;
}
.tabla-datos {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.87rem;
}
.tabla-datos thead tr {
  background: var(--verde);
  color: var(--blanco);
}
.tabla-datos thead th {
  padding: 9px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 0.82rem;
  white-space: nowrap;
}
.tabla-datos tbody tr:nth-child(even) { background: var(--fila-par); }
.tabla-datos tbody tr:hover { background: #EAF3EA; }
.tabla-datos td {
  padding: 5px 6px;
  border-top: 1px solid #EBEBEB;
  vertical-align: middle;
}
.col-num {
  width: 36px;
  text-align: center;
  font-weight: 600;
  color: var(--subtexto);
}
.col-conclusion { width: 130px; }
.col-medicion   { width: 100px; }
.col-accion     { width: 36px; }

/* Inputs dentro de tablas */
.campo-tabla {
  width: 100%;
  padding: 5px 7px;
  border: 1px solid transparent;
  border-radius: 3px;
  font-size: 0.86rem;
  background: transparent;
  color: var(--texto);
  transition: border-color 0.12s, background 0.12s;
}
.campo-tabla:focus {
  outline: none;
  border-color: var(--verde);
  background: var(--blanco);
}
.campo-select {
  padding: 4px 6px;
  cursor: pointer;
}

/* --- Botones --- */
.btn-primario {
  background: var(--verde);
  color: var(--blanco);
  border: none;
  border-radius: 5px;
  padding: 11px 24px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primario:hover { background: var(--verde2); }

.btn-secundario {
  background: var(--blanco);
  color: var(--verde);
  border: 1px solid var(--verde);
  border-radius: 5px;
  padding: 9px 18px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  display: inline-block;
  text-decoration: none;
}
.btn-secundario:hover { background: #F0F7F0; }

.btn-agregar {
  background: none;
  color: var(--verde2);
  border: 1px dashed var(--verde2);
  border-radius: 4px;
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.12s;
}
.btn-agregar:hover { background: #F0F7F0; }

.btn-eliminar {
  background: none;
  border: none;
  color: var(--subtexto);
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 3px;
  line-height: 1;
  transition: color 0.12s, background 0.12s;
}
.btn-eliminar:hover { color: var(--error-borde); background: var(--error-bg); }

/* --- Sección de acciones del formulario --- */
.seccion-acciones {
  background: var(--blanco);
  border: 1px solid #E0E0E0;
  border-radius: 6px;
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.acciones-secundarias {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* --- Vista previa del documento --- */
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.preview-header h2 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--texto);
}
.vista-previa-doc {
  background: var(--blanco);
  border: 1px solid #D0D0D0;
  border-radius: 6px;
  padding: 0;
  overflow: hidden;
}

/* --- Estilos del documento generado (dentro de #vista-previa) --- */
.doc-pagina {
  padding: 40px 48px;
  border-bottom: 2px dashed #E0E0E0;
  page-break-after: always;
}
.doc-pagina:last-child { border-bottom: none; }

.doc-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--verde);
}
.doc-logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}
.doc-logo {
  width: 56px;
  height: 56px;
  background: var(--verde);
  color: var(--blanco);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  flex-shrink: 0;
}
.doc-empresa {
  display: flex;
  flex-direction: column;
}
.doc-empresa-nombre {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--verde);
  line-height: 1.3;
}
.doc-empresa-sub {
  font-size: 0.78rem;
  color: var(--subtexto);
}
.doc-acreditacion {
  font-size: 0.78rem;
  color: var(--subtexto);
  text-align: right;
}

.doc-destinatario {
  margin-bottom: 24px;
  font-size: 0.9rem;
  line-height: 1.8;
}
.doc-destinatario-label {
  font-weight: 600;
  color: var(--subtexto);
  display: inline-block;
  width: 90px;
}

.doc-fecha {
  font-size: 0.9rem;
  color: var(--subtexto);
  margin-bottom: 24px;
}

.doc-cuerpo {
  font-size: 0.9rem;
  line-height: 1.75;
  color: var(--texto);
  text-align: justify;
  margin-bottom: 32px;
}
.doc-cuerpo p { margin-bottom: 14px; }

.doc-firma {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--borde);
}
.doc-firma-nombre {
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.doc-firma-cargo { font-size: 0.85rem; color: var(--subtexto); }

.doc-qr {
  display: inline-block;
  margin-top: 24px;
  padding: 8px;
  border: 1px solid var(--borde);
  border-radius: 4px;
  background: var(--blanco);
}

/* Resumen ejecutivo — dentro del documento */
.doc-seccion-titulo {
  font-size: 1rem;
  font-weight: 700;
  color: var(--verde);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--verde);
}
.doc-intro {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--texto);
  margin-bottom: 20px;
}
.doc-nom-subtitulo {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--subtexto);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 20px 0 8px;
}
.doc-tabla-resumen {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
  margin-bottom: 10px;
}
.doc-tabla-resumen thead tr {
  background: var(--verde);
  color: var(--blanco);
}
.doc-tabla-resumen thead th {
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 0.82rem;
}
.doc-tabla-resumen tbody tr:nth-child(even) { background: var(--fila-par); }
.doc-tabla-resumen td {
  padding: 7px 10px;
  border-top: 1px solid #EBEBEB;
  border: 1px solid var(--borde);
}
.doc-conteos {
  font-size: 0.85rem;
  color: var(--subtexto);
  margin: 8px 0 20px;
  padding: 8px 12px;
  background: #F4F4F4;
  border-radius: 4px;
  line-height: 1.9;
}
.doc-conteo-linea { display: block; }
.doc-conteo-num {
  font-weight: 700;
  color: var(--verde);
  display: inline-block;
  width: 28px;
  text-align: right;
  margin-right: 8px;
}

/* --- Pie de página --- */
.pie-pagina {
  background: var(--verde);
  color: rgba(255,255,255,0.7);
  text-align: center;
  font-size: 0.75rem;
  padding: 12px 24px;
  margin-top: 40px;
}

/* --- Responsive --- */
@media (max-width: 600px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .app-titulo { text-align: left; }
  .campo-fila { grid-template-columns: 1fr; }
  .seccion-acciones { flex-direction: column; align-items: stretch; }
  .preview-header { flex-direction: column; }
  .doc-pagina { padding: 24px; }
  .doc-header { flex-direction: column; gap: 12px; }
  .doc-acreditacion { text-align: left; }
}
</style>
